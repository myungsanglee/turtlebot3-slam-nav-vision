# =============================================================================
# docker-compose.yml  (TurtleBot3 Remote PC + Zenoh Bridge / ROS 2 Humble)
#
# [구성]
#   zenoh-bridge : Pi<->서버 통신의 유일한 통로 (zenoh-bridge-ros2dds, TCP 7447)
#   remote-pc    : SLAM/Nav2/RViz 를 돌리는 개발·작업 컨테이너
#
# [통신 아키텍처 — 2026-08 Zenoh 전환]
#   각 호스트 내부 : ROS_LOCALHOST_ONLY=1 → DDS 는 loopback 만 (같은 호스트의
#                    컨테이너들은 network_mode: host 라 loopback 공유)
#   호스트 간      : zenoh-bridge 가 브리징 (서버가 tcp/7447 listen, Pi 가 접속.
#                    Tailscale 경유. 브리징할 토픽은 config 의 allow 리스트로 제한)
#
#   이전의 Fast DDS Discovery Server 방식(11811)은 VPN+멀티홈+카메라(복잡 참가자)
#   조합에서 데이터 전달이 깨져 폐기 — docs/troubleshooting.md 2026-08-29 참고.
#   덕분에 ROS_DISCOVERY_SERVER / 인터페이스 화이트리스트 / ROS_SUPER_CLIENT 가
#   전부 불필요해짐 (CLI 도 로컬 + 브리지 토픽을 그냥 봄).
#
#   같은 LAN 테스트도 동일 구성으로 동작 (Tailscale 이 LAN 에서도 direct 연결).
#
# [버전 규약] zenoh-bridge 는 서버(Docker)와 Pi(바이너리)가 반드시 동일 버전
#   (현재 1.10.0). 카메라는 compressed 만 브리징 (raw 는 대역폭 초과).
# =============================================================================
services:

  # ── Zenoh Bridge (Pi<->서버 유일 통로, 상시) ─────────────────────────────
  zenoh-bridge:
    image: eclipse/zenoh-bridge-ros2dds:1.10.0   # ★ Pi 바이너리와 버전 일치
    network_mode: host                  # loopback 공유(로컬 DDS) + tailscale listen
    restart: always
    environment:
      - ROS_DISTRO=humble               # 미설정 시 iron 으로 가정해 discovery 정보가 어긋남
      - ROS_LOCALHOST_ONLY=1            # 로컬 DDS 는 loopback 만 (config 값보다 env 가 확실)
      - ROS_DOMAIN_ID=30
    volumes:
      - ./config/zenoh-bridge-server.json5:/conf/zenoh-bridge-server.json5:ro
    command: -c /conf/zenoh-bridge-server.json5

  # ── Remote PC (SLAM / Nav2 / Vision AI / RViz 작업 컨테이너) ─────────────
  remote-pc:
    image: tb3-remote-pc:vision
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: vision           # overlay + Vision AI 추론 스택 (PyTorch CUDA, RF-DETR)
      args:
        ROS_DISTRO: humble

    stdin_open: true
    tty: true
    # 서버 재부팅 후 자동 기동 (수동 `docker compose stop` 한 경우는 유지). 웹 UI 도입 시 web-api 서비스가
    # 같은 정책으로 붙는다 (docs/web_ui_design.md 6장)
    restart: unless-stopped

    network_mode: host      # loopback 공유 (같은 호스트의 zenoh-bridge 와 DDS)
    ipc: host               # 노드 간 공유메모리 전송 성능

    depends_on:
      - zenoh-bridge         # 브리지 먼저 뜨고 remote-pc

    # NVIDIA GPU (RViz 가속 / 추후 비전 AI)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      # 로봇(파이)과 반드시 동일하게 맞출 값
      - TURTLEBOT3_MODEL=${TURTLEBOT3_MODEL:-burger}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # ── DDS 는 이 호스트 안(loopback)만. 원격은 zenoh-bridge 가 담당 ──
      - ROS_LOCALHOST_ONLY=1
      # GUI(X11) 통과 — 서버 물리 세션(:0/:1)에 맞춰 실행 셸의 DISPLAY 사용
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all

    volumes:
      # GUI: 호스트 X 서버 공유 (RViz 를 서버 데스크톱/VNC 화면에 표시)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:rw
      # 개발용: 본인 프로젝트 소스를 호스트에서 마운트 (이미지 재빌드 없이 코드 수정)
      - ./remote_pc:/overlay_ws:rw
      # 커스텀 URDF·CAD 메시 패키지(my_description) — RViz RobotModel 이 package:// 로 메시를 읽도록
      # 레포 최상위 description/ 을 overlay 워크스페이스 안에 중첩 마운트 (colcon build 대상에 포함)
      - ./description:/overlay_ws/src/my_description:rw

    command: bash

  # ── Web API (웹 UI 백엔드 + React 정적 파일, :8080) ───────────────────────
  #   브라우저 → http://<서버 Tailscale IP>:8080  (docs/my_web_api.md)
  #   ★ 전제: my_web_api 가 /overlay_ws 에 빌드돼 있고(colcon build), web/dist 가 빌드돼 있을 것
  #     (npm run build — 없으면 API 만 동작). remote-pc 와 같은 이미지·워크스페이스를 공유한다.
  web-api:
    image: tb3-remote-pc:vision
    network_mode: host               # 로컬 DDS(loopback) + :8080
    ipc: host
    restart: unless-stopped          # 서버 부팅 시 자동 기동
    depends_on:
      - zenoh-bridge
    stop_signal: SIGINT              # ros2 launch 의 정상 종료 경로 (my_web_api/server.py 종료 순서)
    stop_grace_period: 45s           # 웹에서 띄운 SLAM·Nav2·Vision 까지 정상 종료할 시간
    # 웹 모드 관리자가 Vision(TensorRT) 도 띄우므로 GPU 필요
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - TURTLEBOT3_MODEL=${TURTLEBOT3_MODEL:-burger}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./remote_pc:/overlay_ws:rw
      - ./description:/overlay_ws/src/my_description:rw
      - ./web:/web:ro                  # React 빌드 결과는 /web/dist
      - ./secrets:/secrets:ro          # 로봇 전원 버튼용 SSH 키·known_hosts (git 제외, docs/server_setup.md)
    command: ros2 launch my_web_api web_api.launch.py static_dir:=/web/dist

# =============================================================================
# web_api.yaml — 웹 UI 백엔드 설정 (단일 소스). 바꾼 뒤 web-api 컨테이너 재시작:
#   docker compose restart web-api
# 노드 이름(web_api)은 launch 의 name 과 일치해야 한다.
# =============================================================================
web_api:
  ros__parameters:
    host: 0.0.0.0            # 모든 인터페이스 (Tailscale 로 맥·폰에서 접속). 접근 제어는 Tailscale 망 자체
    port: 8080
    static_dir: ''           # React 빌드 결과(web/dist) 경로. '' 면 API 만 제공 (launch 인자로 지정)
    status_period_sec: 0.5   # WebSocket 상태 push 주기

    # 배터리 (TurtleBot3 기본 LiPo 3S 1800mAh) — 판정은 % 대신 셀당 전압으로 (docs/my_web_api.md)
    battery_cells: 3
    battery_warn_cell_v: 3.5       # 이 아래면 '충전 권장' (3S 10.5V)
    battery_critical_cell_v: 3.3   # 이 아래면 '즉시 중단' (3S 9.9V)

    # 감시할 토픽 이름 (기대 주기·한글 이름은 코드의 TOPICS 표)
    topic_odom: /odom
    topic_scan: /scan
    topic_battery: /battery_state
    topic_color: /camera/color/compressed
    topic_depth: /camera/depth/compressed
    topic_vision: /vision/annotated/compressed

    # ---- 지도 화면 (P2) — 모든 좌표를 fixed_frame 기준으로 바꿔 브라우저에 보낸다 ----
    fixed_frame: map
    odom_frame: odom               # map 이 없을 때(SLAM·AMCL 꺼짐) 화면 좌표계 — 라이다·로봇을 계속 실시간 표시
    base_frame: base_footprint     # 로봇 위치로 쓰는 프레임 (slam_toolbox·Nav2 와 같은 기준)
    scan_max_points: 180           # 라이다 360 빔을 이만큼으로 솎아 보냄
    path_max_points: 300           # 경로 점 상한
    # 카메라 depth 점 (라이다처럼 실시간 표시, Nav2 없이도) — depth_points.py
    topic_camera_info: /camera/color/camera_info
    depth_points_period_sec: 0.25  # 4Hz 로 계산·전송 (카메라 6Hz 중)
    depth_points_stride: 8         # 640x480 → 80x60 격자
    depth_points_min_range: 0.2
    depth_points_max_range: 3.0
    depth_points_voxel: 0.05       # 5cm 칸마다 점 하나 (Nav2 장애물 지도 칸과 같음)
    depth_points_z_max: 1.0        # 이보다 높은 점(벽 위·천장)은 보내지 않음
    # 화면에서 '장애물로 찍히는 높이' 색 구분용 — my_navigation nav2_params.yaml camera_mark 의 min/max_obstacle_height 와 맞출 것
    depth_obstacle_min_height: 0.04
    depth_obstacle_max_height: 0.25
    topic_map: /map
    topic_costmap: /local_costmap/costmap               # odom 기준 → 서버가 map 기준으로 변환
    topic_plan: /plan                                   # 전역 경로 (planner)
    topic_local_plan: /local_plan                       # 단기 궤적 (DWB controller)
    topic_footprint: /local_costmap/published_footprint # 실측 footprint (nav2_params.yaml 이 단일 소스)
    nav_action: navigate_to_pose
    topic_initialpose: /initialpose
    topic_robot_description: /robot_description     # 로봇 모양 = URDF 의 base_link 메시
    # 금지 구역 → Nav2 Keepout Filter (nav2_params.yaml 의 keepout_filter.filter_info_topic 과 맞출 것)
    topic_keepout_info: /costmap_filter_info
    topic_keepout_mask: /keepout_filter_mask

    # ---- 모드 관리·지도 저장·조이스틱 (P3) ----
    maps_dir: /overlay_ws/maps        # 저장 지도 (호스트 remote_pc/maps, git 제외). map_saver 형식 yaml + pgm
    mode_ready_timeout_sec: 120.0     # 모드 시작 후 이 시간 안에 Nav2·지도가 안 뜨면 경고 (TensorRT 첫 빌드는 더 걸릴 수 있음)
    topic_cmd_vel: /cmd_vel           # 조이스틱이 내보내는 속도 명령 (geometry_msgs/Twist — Pi 의 turtlebot3_node 와 일치 확인)
    teleop_max_linear: 0.15           # m/s  (TurtleBot3 burger 최대 0.22 — 실내 수동 조작은 여유 있게)
    teleop_max_angular: 1.0           # rad/s (최대 2.84)
